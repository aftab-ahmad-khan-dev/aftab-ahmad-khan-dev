<svg xmlns="http://www.w3.org/2000/svg" width="900" height="70" viewBox="0 0 900 70">
  <rect width="900" height="70" rx="8" fill="#0D1117"/>
  <rect width="900" height="70" rx="8" fill="#10B981" opacity="0.08"/>

  <!-- Binary columns that fade in/out on every page render -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#10B981">
    <text x="24" y="28" opacity="0.55">01001101<animate attributeName="opacity" values="0;0.6;0.25;0.55" dur="2.4s" repeatCount="indefinite"/></text>
    <text x="110" y="42" opacity="0.4">101--110<animate attributeName="opacity" values="0;0.5;0.2;0.4" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></text>
    <text x="200" y="22" opacity="0.5">01100101<animate attributeName="opacity" values="0;0.65;0.2;0.5" dur="3s" begin="0.6s" repeatCount="indefinite"/></text>
    <text x="290" y="40" opacity="0.35">11--0101<animate attributeName="opacity" values="0;0.55;0.15;0.35" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></text>
    <text x="380" y="26" opacity="0.5">01010010<animate attributeName="opacity" values="0;0.6;0.2;0.5" dur="2.9s" begin="0.5s" repeatCount="indefinite"/></text>
    <text x="470" y="38" opacity="0.4">--010011<animate attributeName="opacity" values="0;0.5;0.15;0.4" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></text>
    <text x="560" y="24" opacity="0.55">01001110<animate attributeName="opacity" values="0;0.65;0.25;0.55" dur="2.5s" begin="0.1s" repeatCount="indefinite"/></text>
    <text x="650" y="40" opacity="0.35">001--101<animate attributeName="opacity" values="0;0.5;0.15;0.35" dur="2.7s" begin="0.4s" repeatCount="indefinite"/></text>
    <text x="740" y="28" opacity="0.5">01010011<animate attributeName="opacity" values="0;0.6;0.2;0.5" dur="3.2s" begin="0.7s" repeatCount="indefinite"/></text>
    <text x="830" y="36" opacity="0.4">101--<animate attributeName="opacity" values="0;0.55;0.2;0.4" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></text>
  </g>

  <!-- Dashes draw in -->
  <line x1="40" y1="56" x2="40" y2="56" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
    <animate attributeName="x2" from="40" to="260" dur="1.4s" fill="freeze"/>
  </line>
  <line x1="860" y1="56" x2="860" y2="56" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
    <animate attributeName="x2" from="860" to="640" dur="1.4s" begin="0.3s" fill="freeze"/>
  </line>

  <text x="450" y="44" text-anchor="middle" fill="#ECFDF5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" opacity="0">
    $ ./ship — MERN · Shopify · React Native
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.2s" fill="freeze"/>
  </text>
  <rect x="678" y="32" width="7" height="14" rx="1" fill="#10B981" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1" keyTimes="0;0.35;0.36;0.7;1" dur="2s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
