name: GitHub Stats (self-hosted)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/github-stats.yml"
      - "scripts/generate_metrics.py"

permissions:
  contents: write

jobs:
  generate:
    name: Generate stats images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate overview card
        uses: stn1slv/github-stats-card@v1.1.9
        with:
          card-type: user-stats
          username: ${{ github.repository_owner }}
          token: ${{ secrets.ACCESS_TOKEN }}
          output: generated/overview.svg
          theme: vue-dark
          hide-border: "true"
          show-icons: "true"
          include-all-commits: "true"
          show: repos
          title-color: "10B981"
          bg-color: "0D1117"
          text-color: "c9d1d9"

      - name: Generate languages card
        uses: stn1slv/github-stats-card@v1.1.9
        with:
          card-type: top-langs
          username: ${{ github.repository_owner }}
          token: ${{ secrets.ACCESS_TOKEN }}
          output: generated/languages.svg
          theme: vue-dark
          hide-border: "true"
          layout: compact
          langs-count: "8"
          title-color: "10B981"
          bg-color: "0D1117"
          text-color: "c9d1d9"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate delivery metrics
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          AVG_LOC: "128"
        run: |
          mkdir -p generated
          python3 scripts/generate_metrics.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/overview.svg generated/languages.svg generated/metrics.svg
          if git diff --staged --quiet; then
            echo "No stats changes to commit"
          else
            git commit -m "chore: refresh self-hosted GitHub stats"
            git push
          fi
