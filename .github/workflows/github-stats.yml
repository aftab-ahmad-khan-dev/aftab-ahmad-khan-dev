name: GitHub Stats (self-hosted)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/github-stats.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  generate:
    name: Generate stats images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate overview, languages & metrics
        env:
          # Prefer classic PAT (private + org repos). Falls back to GITHUB_TOKEN.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: |
          mkdir -p generated
          python3 scripts/generate_stats.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/overview.svg generated/languages.svg generated/metrics.svg
          if git diff --staged --quiet; then
            echo "No stats changes to commit"
          else
            git commit -m "chore: refresh self-hosted GitHub stats"
            git push
          fi
