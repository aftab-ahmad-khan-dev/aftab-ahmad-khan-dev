name: GitHub Stats (self-hosted)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/github-stats.yml"
      - "scripts/generate_metrics.py"

permissions:
  contents: write

jobs:
  stats-cards:
    name: Generate overview & languages
    runs-on: ubuntu-latest
    steps:
      - name: Generate overview & languages SVGs
        uses: jstrieb/github-stats@master
        with:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE: ""
          EXCLUDE_LANGS: ""
          LINE_HEIGHT: "21"
          HIDE_BORDER: "true"

  delivery-metrics:
    name: Generate delivery metrics
    needs: stats-cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate metrics.svg
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          AVG_LOC: "128"
        run: |
          mkdir -p generated
          python3 scripts/generate_metrics.py

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/metrics.svg
          if git diff --staged --quiet; then
            echo "No metrics changes"
          else
            git commit -m "chore: refresh delivery metrics"
            git push
          fi
